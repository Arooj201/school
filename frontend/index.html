<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Al-Noor Institute</title>
<style>
:root{
  --primary:#1a56db;--primary-dark:#1240a8;--primary-light:#e8f0fe;
  --danger:#dc2626;--danger-light:#fee2e2;
  --bg:#f1f5f9;--card:#ffffff;--border:#e2e8f0;
  --text:#1e293b;--text-muted:#64748b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,var(--bg),#e0e7ff);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--card);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.12);width:400px;max-width:100%;padding:36px 32px}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.logo-icon{width:48px;height:48px;background:var(--primary);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px}
.logo-text{font-size:16px;font-weight:700;color:var(--text)}
.logo-sub{font-size:12px;color:var(--text-muted)}
h1{font-size:20px;margin-bottom:4px;color:var(--text)}
.subtitle{font-size:13px;color:var(--text-muted);margin-bottom:24px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.form-control{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;color:var(--text);outline:none;transition:border .15s}
.form-control:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.btn-login{width:100%;padding:11px;border-radius:8px;background:var(--primary);color:#fff;border:none;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;transition:.15s}
.btn-login:hover{background:var(--primary-dark)}
.btn-login:disabled{opacity:.6;cursor:not-allowed}
.error-box{background:var(--danger-light);color:#991b1b;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.error-box.show{display:block}
.demo-box{margin-top:24px;padding:14px;background:var(--bg);border-radius:10px;font-size:12px;color:var(--text-muted)}
.demo-box b{color:var(--text)}
.demo-row{display:flex;justify-content:space-between;padding:4px 0;cursor:pointer}
.demo-row:hover{color:var(--primary)}
</style>
</head>
<body>

<div class="login-card">
  <div class="logo">
    <div class="logo-icon">🏫</div>
    <div>
      <div class="logo-text">Al-Noor Institute</div>
      <div class="logo-sub">School · Academy · College</div>
    </div>
  </div>
  <h1>Login Karein</h1>
  <div class="subtitle">Apna email aur password darj karein</div>

  <div class="error-box" id="errorBox"></div>

  <form id="loginForm">
    <div class="form-group">
      <label class="form-label">Email</label>
      <input class="form-control" type="email" id="email" placeholder="admin@alnoor.edu.pk" required>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-control" type="password" id="password" placeholder="••••••••" required>
    </div>
    <button class="btn-login" type="submit" id="loginBtn">Login</button>
  </form>

  <div class="demo-box">
    <b>Demo accounts</b> (click to autofill):
    <div class="demo-row" onclick="fill('admin@alnoor.edu.pk','Admin@123')">👤 Admin — admin@alnoor.edu.pk</div>
    <div class="demo-row" onclick="fill('ali.hassan@alnoor.edu.pk','Staff@123')">👨‍🏫 Staff — ali.hassan@alnoor.edu.pk</div>
    <div class="demo-row" onclick="fill('ahmed.khalid@alnoor.edu.pk','Student@123')">🎓 Student — ahmed.khalid@alnoor.edu.pk</div>
  </div>
</div>

<script src="config.js"></script>
<script>
function fill(email, pass){
  document.getElementById('email').value = email;
  document.getElementById('password').value = pass;
}

// If already logged in, skip straight to the dashboard
if (localStorage.getItem('sms_token')) {
  window.location.href = 'dashboard.html';
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorBox = document.getElementById('errorBox');
  const btn = document.getElementById('loginBtn');

  errorBox.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Logging in...';

  try {
    const res = await fetch(`${API_BASE_URL}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if (!res.ok) {
      errorBox.textContent = data.error || 'Login failed. Please check your details.';
      errorBox.classList.add('show');
      return;
    }

    localStorage.setItem('sms_token', data.token);
    localStorage.setItem('sms_user', JSON.stringify(data.user));
    window.location.href = 'dashboard.html';
  } catch (err) {
    errorBox.textContent = 'Server se connect nahi ho saka. Please check your internet or try again.';
    errorBox.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Login';
  }
});
</script>
</body>
</html>
